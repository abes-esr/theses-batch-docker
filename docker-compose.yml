#
# Ci-dessous la config qui permet de lancer thes-batch
#
# Remarque: avant de lancer docker-compose up, il faut régler le fichier .env
# en partant du fichier .env-dist qui donne les variables d'environnements
# à personnaliser et des exemples de valeurs.
#
services:
  theses-batch:
    build: .
    container_name: theses-batch
    image: abesesr/theses:${THESES_BATCH_VERSION}
    restart: ${RESTART_POLICY}
    mem_limit: ${MEM_LIMIT}
    memswap_limit: ${MEM_LIMIT}
    cpus: ${CPU_LIMIT}
    volumes:
      - type: bind
        source: ${THESES_BATCH_ANR_INPUT_DIR}
        target: /input
      - type: bind
        source: ${THESES_BATCH_ANR_OUTPUT_DIR}
        target: /output
      - type: bind
        source: ${THESES_BATCH_DATA_H2}
        target: /data
    environment:
      THESES_BATCH_VERSION: ${THESES_BATCH_VERSION}

      THESES_BATCH_ANR_PATTERN: ${THESES_BATCH_ANR_PATTERN}
      THESES_BATCH_ANR_MAX_FILES: ${THESES_BATCH_ANR_MAX_FILES}
      THESES_BATCH_ANR_OFFSET: ${THESES_BATCH_ANR_OFFSET}
      THESES_BATCH_ANR_NB_PAGES: ${THESES_BATCH_ANR_NB_PAGES}
      THESES_BATCH_ANR_CONTEXT_CHARACTERS: ${THESES_BATCH_ANR_CONTEXT_CHARACTERS}
      THESES_BATCH_ANR_CHUNK_SIZE: ${THESES_BATCH_ANR_CHUNK_SIZE}
      THESES_BATCH_ANR_EXCLUDE_KEYWORDS: ${THESES_BATCH_ANR_EXCLUDE_KEYWORDS}
      THESES_BATCH_ANR_WRITERS_ENABLED: ${THESES_BATCH_ANR_WRITERS_ENABLED}
      THESES_BATCH_ANR_WRITERS_HEADER: ${THESES_BATCH_ANR_WRITERS_HEADER}
      THESES_BATCH_ANR_JSON_PRETTY_PRINT: ${THESES_BATCH_ANR_JSON_PRETTY_PRINT}
      THESES_BATCH_ANR_FONTS_DIR: ${THESES_BATCH_ANR_FONTS_DIR}

      THESES_BATCH_SOLR_ENABLED: ${THESES_BATCH_SOLR_ENABLED}
      THESES_BATCH_SOLR_BASE_URL: ${THESES_BATCH_SOLR_BASE_URL}
      THESES_BATCH_SOLR_ID_FIELD: ${THESES_BATCH_SOLR_ID_FIELD}
      THESES_BATCH_SOLR_NNT_FIELD: ${THESES_BATCH_SOLR_NNT_FIELD}
      THESES_BATCH_SOLR_DOI_FIELD: ${THESES_BATCH_SOLR_DOI_FIELD}
      THESES_BATCH_SOLR_DEFENSE_DATE_FIELD: ${THESES_BATCH_SOLR_DEFENSE_DATE_FIELD}
      THESES_BATCH_SOLR_CONNECT_TIMEOUT: ${THESES_BATCH_SOLR_CONNECT_TIMEOUT}
      THESES_BATCH_SOLR_READ_TIMEOUT: ${THESES_BATCH_SOLR_READ_TIMEOUT}
  #    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  #    JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
    labels:
      # pour envoyer les logs dans le puits de log de l'abes
      - "co.elastic.logs/enabled=true"
      - "co.elastic.logs/processors.add_fields.target="
      - "co.elastic.logs/processors.add_fields.fields.abes_appli=iar"
      - "co.elastic.logs/processors.add_fields.fields.abes_middleware=java-spring"
      # pour que les mises à jour de cette image soient auto-déployées par wud
      - "wud.watch=true"
      - "wud.watch.digest=true"